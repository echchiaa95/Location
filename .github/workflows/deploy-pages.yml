
name: Build ZIP and Deploy Elite Drive

on:
  push:
    branches:
      - main
    paths:
      - "elite-drive-platform-final.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE="elite-drive-platform-final.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="elite-drive-platform-no-secrets.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP في جذر المستودع."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -name package.json -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "لم يتم العثور على package.json داخل ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extracted/**/package-lock.json

      - name: Configure Supabase and GitHub Pages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://cyvyrqilxxqladucyadk.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_nLEJK83bU1PgTrcWADw77Q_Bh-iWLDN
          EOF

          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.scripts = p.scripts || {};
            p.scripts.build = p.scripts.build || 'vite build';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

          BASE_PATH="/"
          if [ -f vite.config.js ] || [ -f vite.config.ts ] || [ -f vite.config.mjs ]; then
            BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi

          echo "VITE_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build website
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
        run: npm run build -- --base="$VITE_BASE_PATH"

      - name: Prepare Pages artifact
        run: |
          if [ ! -d "$PROJECT_DIR/dist" ]; then
            echo "لم يتم إنشاء مجلد dist بعد البناء."
            exit 1
          fi

          touch "$PROJECT_DIR/dist/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
