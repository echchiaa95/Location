
name: Elite Drive - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elite-drive-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project or extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Prefer the uploaded Elite Drive archive.
          ZIP_FILE="$(find . -type f \
            -iname 'elite-drive-platform*.zip' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Found project archive: $ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/elite-drive-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/elite-drive-source"

            PACKAGE_FILE="$(find "$RUNNER_TEMP/elite-drive-source" \
              -type f -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/dist/*' \
              | head -n 1 || true)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json was not found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          else
            # Otherwise use project files already in the repository.
            if [ -f package.json ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE"
            else
              PACKAGE_FILE="$(find . -type f \
                -name package.json \
                -not -path './.git/*' \
                -not -path './node_modules/*' \
                -not -path './dist/*' \
                | head -n 1 || true)"

              if [ -z "$PACKAGE_FILE" ]; then
                echo "ERROR: No project or Elite Drive ZIP found."
                echo "Upload the ZIP or commit the project source files."
                exit 1
              fi

              PROJECT_DIR="$(dirname "$GITHUB_WORKSPACE/${PACKAGE_FILE#./}")"
            fi
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm test

      - name: Build production website
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "ERROR: Build did not generate dist/index.html"
            exit 1
          fi

          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
