name: Build ZIP and Deploy Elite Drive

on:
push:
branches:
- main
paths:
- '**.zip'
- '.github/workflows/deploy-pages.yml'
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Find and extract ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$(find . -type f -iname '*.zip' \
        -not -path './.git/*' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository."
        echo "Upload your Elite Drive ZIP to GitHub first."
        exit 1
      fi

      echo "Using archive: $ZIP_FILE"
      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted

      PACKAGE_FILE="$(find extracted -type f \
        -name package.json | head -n 1)"

      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: package.json not found in ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm
      cache-dependency-path: extracted/**/package-lock.json

  - name: Configure Supabase
    shell: bash
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    run: |
      set -euo pipefail
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "ERROR: Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in GitHub Actions Variables."
        exit 1
      fi

      echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
      echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

  - name: Install dependencies
    working-directory: ${{ env.PROJECT_DIR }}
    run: npm ci

  - name: Build website
    working-directory: ${{ env.PROJECT_DIR }}
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    run: npm run build

  - name: Verify build output
    shell: bash
    run: |
      set -euo pipefail
      if [ ! -f "$PROJECT_DIR/dist/index.html" ]; then
        echo "ERROR: dist/index.html was not generated."
        exit 1
      fi

      touch "$PROJECT_DIR/dist/.nojekyll"

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ${{ env.PROJECT_DIR }}/dist

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
needs: build
steps:
- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
