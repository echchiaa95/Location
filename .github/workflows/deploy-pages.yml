name: Build ZIP and Deploy Elite Drive

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Find and extract ZIP
    shell: bash
    run: |
      set -euo pipefail
      ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found. Upload the project ZIP to the repository."
        exit 1
      fi
      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted
      PACKAGE_FILE="$(find extracted -type f -name package.json | head -n 1)"
      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: package.json not found in ZIP."
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    working-directory: ${{ env.PROJECT_DIR }}
    run: npm ci

  - name: Build website
    working-directory: ${{ env.PROJECT_DIR }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    run: npm run build

  - name: Verify build output
    run: |
      test -f "${PROJECT_DIR}/dist/index.html"
      touch "${PROJECT_DIR}/dist/.nojekyll"

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ${{ env.PROJECT_DIR }}/dist

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
needs: build
steps:
- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
